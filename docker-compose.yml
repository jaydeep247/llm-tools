services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  nnode-backend:
    build: ./nnode-backend
    container_name: nnode-backend
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      COOKIE_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DB_NAME: seo_crawler
      CORS_ORIGINS: http://localhost:3000,http://134.122.7.161,http://134.122.7.161:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  npy-backend:
    build: ./npy-backend
    container_name: npy-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DB_NAME: seo_crawler

  ref-frontend:
    build:
      context: ./ref-frontend
      args:
        # These are baked into the JS bundle at build time
        NEXT_PUBLIC_API_BASE_URL: http://134.122.7.161:4000/api/v1
        NEXT_PUBLIC_SOCKET_URL: http://134.122.7.161:4000
    container_name: ref-frontend
    ports:
      - "3000:80"
    depends_on:
      nnode-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

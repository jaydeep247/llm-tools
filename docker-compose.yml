  crawl-worker:
    build: ./npy-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-seo_crawler}
      SCRAPY_SETTINGS_MODULE: workers.crawl_worker.spiders.settings
      PYTHONPATH: /app
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    command: scrapy crawl website_spider
    deploy:
      replicas: 2
    restart: unless-stopped


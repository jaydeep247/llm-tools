# =============================================================================
# PRODUCTION NGINX CONFIG - Eliminates ChunkLoadError
# 
# KEY INSIGHT: Static assets are served DIRECTLY from filesystem, not proxied.
# This guarantees that as long as this container is running, ALL its assets
# are available. No race conditions, no hash mismatches.
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root for static file serving
    root /app;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================================================
    # CRITICAL: Serve _next/static DIRECTLY from filesystem
    # This is the fix for ChunkLoadError - no proxy, no timing issues
    # =========================================================================
    location /_next/static {
        alias /app/.next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================================================================
    # Serve public assets directly (images, fonts, etc.)
    # =========================================================================
    location /images {
        alias /app/public/images;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Favicon and static root files
    location = /favicon.ico {
        alias /app/public/favicon.ico;
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        alias /app/public/robots.txt;
        expires 1d;
        access_log off;
    }

    # =========================================================================
    # Next.js image optimization - must go through Node.js
    # =========================================================================
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # =========================================================================
    # Data fetching routes - must go through Node.js
    # =========================================================================
    location /_next/data {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # API Proxy - Route /api/* to backend container
    # =========================================================================
    location /api/ {
        proxy_pass http://nnode-backend:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================================
    # Socket.io Proxy - Route WebSocket connections to backend
    # =========================================================================
    location /socket.io/ {
        proxy_pass http://nnode-backend:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # =========================================================================
    # All other routes - proxy to Next.js server
    # =========================================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =========================================================================
    # Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Client limits
    client_max_body_size 100M;
}

# Run only Redis and PostgreSQL (no app services).
# Usage: docker-compose -f docker-compose.redis-postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: contentlytics-db
    env_file: .env
    environment:
      POSTGRES_DB: contentlytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  redis:
    image: redis:7-alpine
    user: "999:999"
    container_name: contentlytics-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --dir /data
    env_file: .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

networks:
  db-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

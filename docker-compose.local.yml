services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_LOG_LEVEL: error
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit log [{console,[{level,error}]}]"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nnode-backend:
    build: ./nnode-backend
    container_name: nnode-backend
    ports:
      - "${BACKEND_PORT:-3004}:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-904802294750-6l7h0olnfrpi83fkt3pml5ng2mqk0ntv.apps.googleusercontent.com}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ALLOW_LOCAL_INFRA_IN_PROD: ${ALLOW_LOCAL_INFRA_IN_PROD:-false}
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-seo_crawler}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost,http://209.38.70.65}
      NPY_BACKEND_URL: http://npy-backend:8001
    restart: unless-stopped

  npy-backend:
    build: ./npy-backend
    container_name: npy-backend
    ports:
      - "${NPY_HTTP_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ALLOW_LOCAL_INFRA_IN_PROD: "true"
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-seo_crawler}
      # S3/DigitalOcean Spaces Configuration
      S3_ENABLED: ${S3_ENABLED:-true}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://sfo3.digitaloceanspaces.com}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-colytics-stage}
      S3_REGION: ${S3_REGION:-sfo3}
      # Crawl Limits
      MAX_CRAWL_PAGES: ${MAX_CRAWL_PAGES:-10}
      # AI API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # DataForSEO Credentials
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD}
      # Google Analytics
      GA_PROPERTY_ID: ${GA_PROPERTY_ID:-}
      GA_SERVICE_ACCOUNT_JSON: /app/ga-credentials.json
    volumes:
      - ./ga-credentials.json:/app/ga-credentials.json:ro

  ref-frontend:
    build:
      context: ./ref-frontend
      args:
        # These are baked into the JS bundle at build time
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-904802294750-6l7h0olnfrpi83fkt3pml5ng2mqk0ntv.apps.googleusercontent.com}
    container_name: ref-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - nnode-backend
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
